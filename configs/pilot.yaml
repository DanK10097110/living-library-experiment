# Pilot configuration — FROZEN after M9 commit (Phase 1 Week 2)
# Freeze timestamp: 2026-11-10
# Branch: topic/atharv/pilot
#
# IMPORTANT: Do NOT modify this file after the freeze commit.
# All 300-episode practice runs and 140-episode valid_seen evaluations
# use the values below. Changing them invalidates the pilot results.

# ── Environment ─────────────────────────────────────────────
environment:
  data_dir: "~/.cache/alfworld/json_2.1.1"
  split: "train"                     # practice split
  max_steps_per_episode: 50          # step budget per episode
  excluded_patterns:                 # skip Sliced / movable_recep games
    - "Sliced"
    - "movable_recep"

# ── Task types (the 6 ALFWorld task families) ───────────────
task_types:
  - pick_and_place_simple
  - look_at_obj_in_light
  - pick_clean_then_place_in_recep
  - pick_heat_then_place_in_recep
  - pick_cool_then_place_in_recep
  - pick_two_obj_and_place

# ── Pilot run ───────────────────────────────────────────────
pilot:
  num_practice_episodes: 300
  eval_split: "valid_seen"           # development evaluation (NOT valid_unseen)
  random_seed: 42

# ── L1 planner ──────────────────────────────────────────────
l1_planner:
  model: "qwen3-14b-q4"             # or path to GGUF
  temperature: 0.3
  max_tokens: 512
  # For the pilot without a real LLM, use "heuristic" mode
  mode: "heuristic"                  # "heuristic" | "llm"

# ── L2 skill writer ────────────────────────────────────────
l2_skill_writer:
  model: "qwen2.5-coder-7b-q4"      # or path to GGUF
  temperature: 0.2
  max_tokens: 1024
  # For the pilot without a real LLM, use "heuristic" mode
  mode: "heuristic"                  # "heuristic" | "llm"

# ── Skill library ──────────────────────────────────────────
skill_library:
  retrieval_top_k: 3
  similarity_threshold: 0.4
  max_tests_per_skill: 10
  # Beta-posterior reliability scoring
  beta_prior_alpha: 1
  beta_prior_beta: 1
  reliability_percentile: 10        # 10th percentile of Beta posterior

# ── Executor ────────────────────────────────────────────────
executor:
  max_skill_steps: 20               # max actions within one skill execution
  allowed_action_prefixes:           # restrict generated skills to these
    - "go to"
    - "take"
    - "put"
    - "open"
    - "close"
    - "use"
    - "clean"
    - "heat"
    - "cool"
    - "examine"
    - "look"
    - "inventory"

# ── Metrics ─────────────────────────────────────────────────
metrics:
  log_dir: "results/"
  log_every_step: true
