[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "living-library-experiment"
version = "0.1.0"
description = "ALFWorld agent-memory experiment: a managed rule manual vs trajectories, append-only rules and no memory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.8"]

[project.optional-dependencies]
alfworld = ["alfworld>=0.4.2"]
embeddings = ["sentence-transformers>=5.0"]
plots = ["matplotlib>=3.8"]

[project.scripts]
living-library = "living_library.cli:main"

[tool.setuptools.packages.find]
include = ["living_library*"]

[tool.setuptools.package-data]
living_library = ["prompts/*.json", "prompts/*.md", "prompts/LICENSE-*"]
